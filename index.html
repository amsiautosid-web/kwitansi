.nx{color:#a77d2c!important;font-weight:700}.hint{background:#fff8e6;border:1px solid #f0e2b8;color:#6b5420;border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.45;margin:0 0 12px}.cf{position:fixed;top:-24px;font-size:22px;animation:cfall 1.9s ease-in forwards;z-index:120;pointer-events:none}@keyframes cfall{to{transform:translateY(108vh) rotate(540deg)}}

<body>
<header class="top"><div class="in"><div class="logo"><b>AMSIAUTOS</b><small>KWITANSI &amp; BAST DIGITAL</small></div><div id="hact"></div></div></header>
<main class="wrap" id="app"></main>
<div class="bar" id="bar" hidden></div>
<div id="modal" hidden></div><div id="toast" hidden></div><div id="printRoot"></div>
<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(Number(n)||0).toLocaleString('id-ID');
const rp=n=>'Rp '+fmt(n);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const wib=s=>s?new Date(s).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',dateStyle:'long',timeStyle:'short'})+' WIB':'-';
const dlong=s=>{try{return new Date(s+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){return s}};
const waNum=p=>{let d=String(p||'').replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);else if(d.startsWith('8'))d='62'+d;return d};
let S={docs:[],seq:0,bank:{penjual:[],pembeli:[],kendaraan:[]},pref:{company:'',alias:'',legal:'',bid:'',code:'AMS',address:'',phone:'',email:'',rep:'',title:'Perwakilan',city:'',tag:'JUAL BELI KENDARAAN · DIGITAL',bank:'',perm:'',logo:''}},cur=null,step='pihak',pv='kw',UI={notes:{},other:{},acc:{},view:'depan'},saveT,tt;

/* ===== penyimpanan ===== */
const DBN='amsi_kwbast';
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function load(){try{const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get('st');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){try{return JSON.parse(localStorage.getItem(DBN)||'null')}catch(x){return null}}}

function keab(d,am,c){const pr=d.type==='perantara',bene=pr?'Pembeli dan '+am:am;
 return art(c,'PERNYATAAN DAN JAMINAN KEABSAHAN ASAL-USUL KENDARAAN',[L([
 'Penjual menyatakan dan menjamin dengan sebenar-benarnya bahwa: (a) Kendaraan adalah <b>milik sah Penjual</b>, atau Penjual berwenang penuh menjualnya dan telah memperoleh persetujuan seluruh pihak yang berhak (termasuk pasangan atau ahli waris bila ada); (b) Kendaraan diperoleh secara sah dan <b>bukan berasal dari atau terkait dengan hasil tindak pidana</b>, termasuk namun tidak terbatas pada penipuan, penggelapan, pencurian, penadahan, pemalsuan dokumen, pencucian uang, ataupun kejahatan lainnya; (c) Kendaraan tidak sedang dalam sengketa, sitaan, blokir, gadai, sewa, leasing, jaminan atau fidusia, maupun proses hukum apa pun, kecuali telah diungkapkan tertulis dalam dokumen ini dan telah dilunasi; (d) seluruh dokumen (BPKB, STNK, faktur, identitas, dan lainnya) asli, sah, dan tidak dipalsukan, serta nomor rangka dan nomor mesin sesuai dokumen dan fisik; (e) tidak ada pihak ketiga yang berhak menuntut atas Kendaraan; dan (f) Penjual telah menyampaikan informasi yang benar mengenai riwayat Kendaraan.',
 'Apabila di kemudian hari, baik sebelum maupun sesudah pembayaran atau serah terima, terbukti atau timbul dugaan beralasan bahwa pernyataan pada ayat 1 tidak benar, Kendaraan berasal dari atau terkait tindak pidana, atau timbul tuntutan, gugatan, pelaporan, penyitaan, pemblokiran, atau perkara hukum apa pun (pidana, perdata, maupun administrasi) terkait asal-usul, kepemilikan, atau dokumen Kendaraan, maka <b>seluruh akibat hukumnya, beserta biaya dan kerugian yang timbul, menjadi tanggung jawab penuh dan pribadi Penjual</b>.',
 'Penjual wajib dan sepakat untuk: (a) <b>membebaskan, melindungi, dan mengganti kerugian '+bene+'</b> (termasuk pengurus, karyawan, dan pembeli selanjutnya) dari segala tuntutan, gugatan, denda, biaya, dan kerugian, termasuk biaya perkara dan biaya advokat, baik dari pihak berwenang maupun pihak ketiga; (b) mengembalikan seluruh pembayaran yang telah diterimanya dalam waktu 3 x 24 jam sejak pemberitahuan tertulis (termasuk pesan elektronik), disertai ganti rugi atas biaya perbaikan, penurunan nilai, kehilangan keuntungan, dan biaya lain yang timbul; serta (c) menghadapi dan menyelesaikan perkara tersebut atas biaya dan tanggung jawabnya sendiri. '+am+' dinyatakan sebagai pihak yang beritikad baik dan <b>tidak dapat dimintai pertanggungjawaban hukum</b>, pidana maupun perdata, atas hal-hal tersebut.',
 'Penjual menyetujui bahwa '+am+' berhak: (a) menunda atau menahan pembayaran sampai verifikasi dokumen dan pemeriksaan fisik selesai; (b) membatalkan secara sepihak apabila hasil verifikasi tidak memuaskan atau terdapat keraguan beralasan; (c) memotong ganti rugi dari pembayaran yang belum diserahkan; dan (d) melaporkan dugaan tindak pidana kepada pihak berwenang serta menyerahkan salinan dokumen dan identitas Penjual untuk keperluan tersebut.',
 'Penjual memahami bahwa pernyataan yang tidak benar dapat dikenai sanksi pidana menurut Kitab Undang-Undang Hukum Pidana (UU No. 1 Tahun 2023) dan peraturan terkait, serta tanggung jawab perdata berdasarkan Pasal 1365 KUHPerdata (perbuatan melawan hukum), Pasal 1243 KUHPerdata (ganti rugi wanprestasi), Pasal 1471 KUHPerdata (jual beli barang milik orang lain), dan Pasal 1491 KUHPerdata (kewajiban Penjual menjamin penguasaan Kendaraan secara aman dan tenteram).'])])}

 hargaItems=['Harga jual beli yang disepakati adalah <b>'+rp(d.pay.price)+'</b> (<i>'+esc(cap(terbilang(d.pay.price)))+' rupiah</i>), dibayar melalui '+esc(d.pay.method)+(d.pay.bank?' ('+esc(d.pay.bank)+')':'')+'.','Telah dibayar sebelumnya '+rp(d.pay.before)+'; dibayar pada saat ini '+rp(d.pay.now)+'; sisa '+(s?'<b>'+rp(s)+'</b>':'<b>0 (LUNAS)</b>')+'. Bukti pembayaran/kwitansi merupakan bagian tidak terpisahkan dari dokumen ini.'].concat(dpPrev?[dpPrev]:[]).concat(j?['Hak milik atas Kendaraan baru beralih kepada Pembeli setelah seluruh harga dibayar lunas dan diterima efektif oleh Penjual. Selama belum lunas, Penjual berhak menahan Kendaraan dan dokumen aslinya.','Biaya transfer, pajak, dan biaya pengurusan peralihan (bila Pembeli memilih melakukannya) ditanggung Pembeli.',lateTxt]:pr?['Hak milik beralih dari Penjual kepada Pembeli setelah seluruh harga dibayar lunas dan diterima efektif oleh Penjual.',d.pay.to==='amsi'?'Pembayaran Pembeli diterima §A§ untuk diteruskan kepada Penjual. Pembayaran kepada §A§ dianggap pembayaran kepada Penjual sebatas jumlah pada kwitansi, dan §A§ wajib meneruskannya kepada Penjual setelah dipotong hal-hal yang menjadi tanggungan Penjual menurut dokumen ini.':'Pembayaran dilakukan langsung oleh Pembeli kepada Penjual.',feeTxt,lateTxt]:['Hak milik beralih kepada §A§ setelah pembayaran diterima Penjual dan Kendaraan beserta dokumen diserahkan.','Pembayaran oleh §A§ dilakukan setelah verifikasi dokumen dan pemeriksaan fisik selesai dan hasilnya memuaskan §A§. §A§ berhak menunda atau menahan pembayaran sampai verifikasi selesai, termasuk pengecekan BPKB, STNK, nomor rangka dan mesin, status pajak, fidusia, serta keabsahan asal-usul Kendaraan.','§A§ berhak memotong dari pembayaran: tunggakan pajak, denda, tilang, dan biaya pengurusan dokumen yang kurang, yang menjadi tanggungan Penjual. Pembayaran dianggap lunas sebatas jumlah yang tertera pada kwitansi.']).filter(Boolean),

 kondisi=j?art(c,'KONDISI KENDARAAN',[L(['Pembeli menyatakan telah diberi kesempatan memeriksa, mencoba (test drive), dan bila perlu memeriksakan Kendaraan kepada pihak ahli pilihannya.','Kendaraan merupakan kendaraan bekas dan dijual <b>sebagaimana adanya</b> pada saat serah terima. Pembeli menerima keausan wajar serta seluruh cacat tampak maupun yang dicatat pada lampiran.',showroom(d),'Pembeli membeli atas pertimbangan dan penilaiannya sendiri, dan <b>tidak mengandalkan iklan, foto, maupun janji lisan</b> di luar dokumen ini. Tidak ada kesepakatan lain yang mengikat selain yang tertulis dalam dokumen ini.','Penjual tidak memberikan garansi apa pun, kecuali yang ditulis tegas pada syarat khusus.','Penjual menyatakan bahwa sepanjang pengetahuannya tidak ada cacat yang sengaja disembunyikan dari Pembeli. Sejauh diizinkan hukum, Pembeli melepaskan tuntutan atas cacat yang tidak diketahui Penjual (vide Pasal 1506 KUHPerdata).'])]):pr?art(c,'KONDISI KENDARAAN',[L(['Pembeli menyatakan telah diberi kesempatan memeriksa, mencoba (test drive), dan bila perlu memeriksakan Kendaraan kepada pihak ahli pilihannya.','Kendaraan merupakan kendaraan bekas dan dijual <b>sebagaimana adanya</b> pada saat serah terima. Pembeli menerima keausan wajar serta seluruh cacat tampak maupun yang dicatat pada lampiran.','Pembeli tidak mengandalkan iklan, foto, maupun janji lisan di luar dokumen ini.','Penjual dan Perantara tidak memberikan garansi apa pun, kecuali yang ditulis tegas pada syarat khusus.','Penjual menyatakan bahwa sepanjang pengetahuannya tidak ada cacat yang sengaja disembunyikan. Sejauh diizinkan hukum, Pembeli melepaskan tuntutan atas cacat yang tidak diketahui Penjual dan Perantara (vide Pasal 1506 KUHPerdata).'])]):art(c,'KONDISI KENDARAAN DAN KEJUJURAN PENJUAL',[L(['Penjual menyatakan telah memberi informasi yang benar mengenai kondisi dan riwayat Kendaraan, termasuk kecelakaan, banjir, penggantian odometer, perbaikan besar, dan kerusakan mesin.','§A§ telah memeriksa Kendaraan dan menerimanya sesuai kondisi yang tercatat pada lampiran, dengan tetap bergantung pada kebenaran pernyataan Penjual.','Apabila kemudian terbukti informasi Penjual tidak benar atau ada hal material yang disembunyikan, §A§ berhak membatalkan jual beli dan meminta pengembalian pembayaran, atau meminta penyesuaian harga yang wajar, tanpa mengurangi hak menuntut ganti rugi.'])]),

const b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function aesKey(pw,salt,use){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,[use])}
async function enc(text,pw){if(!(window.crypto&&crypto.subtle))throw new Error('Enkripsi tidak didukung di browser ini');const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await aesKey(pw,salt,'encrypt'),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text)));return JSON.stringify({v:1,s:b64(salt),i:b64(iv),c:b64(ct)})}
async function dec(txt,pw){let o;try{o=JSON.parse(txt)}catch(e){throw new Error('Data cloud tidak valid')}try{const key=await aesKey(pw,unb64(o.s),'decrypt');return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.i)},key,unb64(o.c)))}catch(e){throw new Error('Kata sandi enkripsi salah')}}
